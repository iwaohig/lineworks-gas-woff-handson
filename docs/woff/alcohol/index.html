<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>アルコールチェック</title>
<style>
  :root { --green:#00c85f; --navy:#202936; --bg:#f0f4f8; --line:#d9e0e8; --muted:#5f6b7a; --red:#c8352b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--navy); font:15px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Meiryo",sans-serif; }
  header { background:var(--navy); color:#fff; padding:14px 16px; }
  header h1 { margin:0; font-size:17px; }
  header p { margin:2px 0 0; font-size:12px; opacity:.8; }
  main { padding:16px; max-width:520px; margin:0 auto; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:12px; }
  .who { display:flex; gap:10px; align-items:center; }
  .who img { width:40px; height:40px; border-radius:50%; background:var(--bg); }
  .label { font-size:12px; color:var(--muted); margin-bottom:6px; }
  .seg { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .seg input { display:none; }
  .seg label { display:block; text-align:center; padding:12px 8px; border:1px solid var(--line); border-radius:8px; background:#fff; font-weight:600; }
  .seg input:checked + label { border-color:var(--green); background:#e6f9ef; color:#007a3a; }
  .seg input.bad:checked + label { border-color:var(--red); background:#fdeceb; color:var(--red); }
  select, textarea, input[type=text] { width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; font:inherit; background:#fff; }
  button { width:100%; padding:14px; border:0; border-radius:10px; background:var(--green); color:#fff; font-size:16px; font-weight:700; }
  button:disabled { opacity:.5; }
  .msg { margin-top:10px; font-size:14px; }
  .msg.err { color:var(--red); }
  .done { text-align:center; padding:28px 14px; }
  .done b { display:block; font-size:20px; margin-bottom:6px; }
</style>
</head>
<body>
<header>
  <h1>アルコールチェック</h1>
  <p id="today"></p>
</header>
<main>
  <div class="card who">
    <img id="avatar" alt="">
    <div><div class="label">回答する人 (LINE WORKS のログインで自動)</div><div id="name">読み込み中…</div></div>
  </div>

  <form id="form" hidden>
    <div class="card">
      <div class="label">区分</div>
      <div class="seg">
        <input type="radio" name="timing" id="t1" value="運転前" checked><label for="t1">運転前</label>
        <input type="radio" name="timing" id="t2" value="運転後"><label for="t2">運転後</label>
      </div>
    </div>
    <div class="card">
      <div class="label">アルコールは検知されましたか</div>
      <div class="seg">
        <input type="radio" name="detected" id="d1" value="なし" checked><label for="d1">検知なし</label>
        <input type="radio" name="detected" id="d2" value="あり" class="bad"><label for="d2">検知あり</label>
      </div>
    </div>
    <div class="card">
      <div class="label">確認してくれた人</div>
      <select name="checker" id="checker" required>
        <option value="">選んでください</option>
        <option>所属長</option>
        <option>安全運転管理者</option>
        <option>副安全運転管理者</option>
        <option>その他 (備考に記入)</option>
      </select>
    </div>
    <div class="card">
      <div class="label">備考 (任意)</div>
      <textarea name="note" rows="2"></textarea>
    </div>
    <button type="submit" id="submit">送信する</button>
    <div class="msg" id="msg"></div>
  </form>

  <div class="card done" id="done" hidden>
    <b>送信しました</b>
    <span id="doneText"></span>
  </div>
</main>

<script src="https://static.worksmobile.net/static/wm/woff/edge/3.7.4/sdk.js"></script>
<script>
// 設定は URL の後ろから受け取る: ?woffId=<WOFF ID>&api=<GAS ウェブアプリの URL>
// (WOFF の Endpoint URL にこの形で登録する。どちらも秘密の値ではない)
const params = new URLSearchParams(location.search);
const WOFF_ID = params.get('woffId');
const API_URL = params.get('api');
// PC のブラウザで開くときに使う scope。WOFF の入り口が openid を求めるので、
// Client App の OAuth Scopes に openid と user.read (/users/me に要る) を入れておくこと
// (入っていないと「使用できない Scope が含まれています」になる)
const SCOPE = 'openid user.read';

const $ = id => document.getElementById(id);
$('today').textContent = new Date().toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });

function showError(text) {
  $('name').textContent = '—';
  $('msg').textContent = text;
  $('msg').className = 'msg err';
  $('form').hidden = false;
  $('submit').disabled = true;
}

async function start() {
  if (!WOFF_ID || !API_URL) return showError('URL に woffId と api がありません。WOFF の Endpoint URL の設定を確かめてください。');
  try {
    await woff.init({ woffId: WOFF_ID, scope: SCOPE, redirectUri: location.href });
    if (!woff.isLoggedIn()) { woff.login({ scope: SCOPE, redirectUri: location.href }); return; }
    const p = await woff.getProfile();
    $('name').textContent = p.displayName;
    if (p.pictureUrl) $('avatar').src = p.pictureUrl;
    $('form').hidden = false;
  } catch (e) {
    showError('WOFF の初期化に失敗しました: ' + (e.message || e));
  }
}

$('form').addEventListener('submit', async ev => {
  ev.preventDefault();
  const f = new FormData(ev.target);
  if (!f.get('checker')) { $('msg').textContent = '確認してくれた人を選んでください。'; $('msg').className = 'msg err'; return; }
  $('submit').disabled = true;
  $('msg').textContent = '送信しています…';
  $('msg').className = 'msg';
  try {
    // GAS のウェブアプリはプリフライト (OPTIONS) に答えられないので text/plain で送る。
    // ヘッダーも読めないので、本人を確かめるためのアクセストークンは本文に入れる。
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        token: woff.getAccessToken(),
        timing: f.get('timing'),
        detected: f.get('detected'),
        checker: f.get('checker'),
        note: f.get('note'),
      }),
    });
    const out = await res.json();
    if (!out.ok) throw new Error(out.error || '保存できませんでした');
    $('form').hidden = true;
    $('done').hidden = false;
    $('doneText').textContent = out.name + ' さん / ' + out.timing + ' / 検知' + out.detected + ' (' + out.time + ')';
  } catch (e) {
    $('submit').disabled = false;
    $('msg').textContent = '送信に失敗しました: ' + (e.message || e);
    $('msg').className = 'msg err';
  }
});

start();
</script>
</body>
</html>
